Global:
  debug: false
  use_gpu: true
  epoch_num: 20  ## MODIFIED
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: C:/Pyg/Projects/semi/yuzyproject-aimodels/output/det_ke_model
  save_epoch_step: 1  ## MODIFIED
  eval_batch_step: 4000  ## MODIFIED
  cal_metric_during_train: true
  pretrained_model: C:/Users/pak10/.paddleocr/models/ch_PP-OCRv4_det_train/best_accuracy
  checkpoints: null
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_inference_dir: ./output/det_ke_inference
  use_pdserving: false

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.75
    det: True
  Neck:
    name: RSEFPN
    out_channels: 96
    shortcut: True
  Head:
    name: DBHead
    k: 50
    fix_nan: True

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 1  ## MODIFIED
  regularizer:
    name: L2
    factor: 0.00001

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.6
  max_candidates: 1000
  unclip_ratio: 1.5
  use_dilation: false
  score_mode: fast

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: null
    label_file_list:
      - C:/Pyg/Projects/semi/yuzyproject-aimodels/core/paddle_train/data/det/train_label.txt
    ratio_list: [1.0]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - DetLabelEncode: null
      - IaaAugment:
          augmenter_args:
            - { 'type': Fliplr, 'args': { 'p': 0.5 } }
            - { 'type': Affine, 'args': { 'rotate': [-10, 10] } }
            - { 'type': Resize, 'args': { 'size': [0.5, 3] } }
      - EastRandomCropData:
          size: [640, 640]  ## MODIFIED
          # size: [736, 736]  # 타협안 (OOM 발생 시 사용)
          max_tries: 50
          keep_ratio: true
      - MakeBorderMap:
          shrink_ratio: 0.4
          thresh_min: 0.3
          thresh_max: 0.7
      - MakeShrinkMap:
          shrink_ratio: 0.4
          min_text_size: 8
      - NormalizeImage:
          scale: 1./255.
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          order: hwc
      - ToCHWImage: null
      - KeepKeys:
          keep_keys: ['image', 'threshold_map', 'threshold_mask', 'shrink_map', 'shrink_mask']
  loader:
    shuffle: true
    batch_size_per_card: 16  ## MODIFIED (OOM 없으면 16, OOM이면 8)
    drop_last: true
    num_workers: 4  ## MODIFIED
    pin_memory: true

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: null
    label_file_list:
      - C:/Pyg/Projects/semi/yuzyproject-aimodels/core/paddle_train/data/det/val_label.txt
    ratio_list: [1.0]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - DetLabelEncode: null
      - DetResizeForTest:
          limit_side_len: 960
          limit_type: max
      - NormalizeImage:
          scale: 1./255.
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          order: hwc
      - ToCHWImage: null
      - KeepKeys:
          keep_keys: ['image', 'shape', 'polys', 'ignore_tags']
  loader:
    shuffle: false
    batch_size_per_card: 1
    drop_last: false
    num_workers: 4  ## MODIFIED
    pin_memory: true

